name: Intentional configuration failure
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  configuration-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: configuration-check
        run: python3 examples/failing_check.py
